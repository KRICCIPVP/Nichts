<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Präsentation">

    <link rel="manifest" href="manifest.json">

    <title>Präsentation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="presentation">

    <!-- Folie 1 -->
    <section class="slide active" id="slide1">
        <h1>PRÄSENTATION</h1>
        <button id="startButton">▶ Start</button>
    </section>

    <!-- Folie 2 -->
    <section class="slide" id="slide2">
        <h1>🎉 ÜBERRASCHUNG 🎉</h1>
    </section>

    <!-- Folie 3 -->
    <section class="slide" id="slide3">
        <h1>3</h1>
    </section>

    <!-- Folie 4 -->
    <section class="slide" id="slide4">
        <h1>2</h1>
    </section>

    <!-- Folie 5 -->
    <section class="slide" id="slide5">
        <h1>1</h1>
    </section>

    <!-- Folie 6 -->
    <section class="slide" id="slide6">
        <div id="nothing"></div>
    </section>

</div>

<script>

let currentSlide = 1;

const slides = document.querySelectorAll(".slide");
const startButton = document.getElementById("startButton");

function nextSlide() {

    if (currentSlide >= 6) return;

    slides[currentSlide - 1].classList.remove("active");

    currentSlide++;

    slides[currentSlide - 1].classList.add("active");

    if (currentSlide === 6) {

        const container = document.getElementById("nothing");

        for (let i = 0; i < 300; i++) {

            const text = document.createElement("span");

            text.textContent = "nichts";

            container.appendChild(text);
        }
    }
}


// Start-Button
startButton.addEventListener("click", function(event) {

    event.stopPropagation();

    nextSlide();

});


// Auf Folien 2–5: Tippen = nächste Folie
document.addEventListener("click", function() {

    if (currentSlide >= 2 && currentSlide < 6) {
        nextSlide();
    }

});

</script>

</body>
</html>
