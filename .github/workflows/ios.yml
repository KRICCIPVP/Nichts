name: nichts iOS Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node installieren
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Capacitor prüfen
        run: npx cap doctor

      - name: iOS Dateien aktualisieren
        run: npx cap copy ios

      - name: Xcode Version
        run: xcodebuild -version

      - name: iOS bauen
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
